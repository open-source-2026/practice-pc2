spring.application.name=practice-pc2

spring.datasource.url=jdbc:mysql://${DATABASE_URL:localhost}:${DATABASE_PORT:3306}/${DATABASE_NAME:practice-pc2}?useSSL=true&serverTimezone=UTC&createDatabaseIfNotExist=true&publicKeyRetrieval=true
spring.datasource.username=${DATABASE_USER:root}
spring.datasource.password=${DATABASE_PASSWORD:password}

#Shared Spring Data JPA Hibernate Configuration
spring.jpa.hibernate.naming.physical-strategy= com.platform.practicepc2.shared.infrastructure.persistence.jpa.configuration.strategy.SnakeCaseWithPluralizedTablePhysicalNamingStrategy
spring.jpa.hibernate.ddl-auto=update

documentation.application.description=@project.description@
documentation.application.version=@project.version@